name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"   # ต้องตรงกับ tag ของ image barichello/godot-ci

jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งค่า export templates + Android SDK + debug keystore
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
          rm -f /root/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT

      - name: หาโฟลเดอร์โปรเจกต์ (project.godot)
        run: |
          P=$(find . -name project.godot -not -path "./.git/*" | head -1)
          if [ -z "$P" ]; then echo "ไม่พบ project.godot ใน repo - ตรวจว่าอัปโหลดไฟล์ครบ"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$P")" >> $GITHUB_ENV
          echo "พบโปรเจกต์ที่: $(dirname "$P")"

      - name: Import โปรเจกต์
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Export APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/arena_strike.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: arena_strike_apk
          path: build/arena_strike.apk
