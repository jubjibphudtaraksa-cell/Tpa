name: Build AnchorCharge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o anchor-charge.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle --no-daemon build
        working-directory: anchor-charge
      - uses: actions/upload-artifact@v4
        with:
          name: AnchorCharge
          path: anchor-charge/build/libs/anchor-charge-1.0.0.jar
