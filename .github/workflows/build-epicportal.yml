name: Build EpicPortal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o EpicPortal-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: EpicPortal/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: EpicPortal
      - uses: actions/upload-artifact@v4
        with:
          name: EpicPortal
          path: EpicPortal/target/EpicPortal-*.jar
