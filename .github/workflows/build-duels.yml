name: Build SwordDuels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o SwordDuels-Paper.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SwordDuels/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: SwordDuels
      - uses: actions/upload-artifact@v4
        with:
          name: SwordDuels
          path: SwordDuels/target/SwordDuels-1.0.0.jar
