name: Build KapomLink
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o KapomLink-1.1.0-VortexStore.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: KapomLink-1.1.0/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: KapomLink-1.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: KapomLink
          path: KapomLink-1.1.0/target/KapomLink-1.1.0.jar
