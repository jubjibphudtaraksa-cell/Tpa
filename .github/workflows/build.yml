name: Build SimpleTPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o SimpleTPA.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SimpleTPA/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: SimpleTPA
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleTPA
          path: SimpleTPA/target/SimpleTPA-1.0.jar
